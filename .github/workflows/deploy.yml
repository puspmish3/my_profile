name: Cloudflare Pages Auto Deploy

on:
  push:
    branches:
      - main  # Changes to this branch will trigger the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler-action uses 'command' to trigger the modern pages deployment
          command: pages deploy . --project-name="my-profile"
