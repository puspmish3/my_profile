name: Cloudflare Pages Auto Deploy

on:
  push:
    branches:
      - main  # Changes to this branch will trigger the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'my-profile' # Replace with your exact Cloudflare project name
          directory: '.' # Change to './dist' or './build' if your framework requires a build folder
